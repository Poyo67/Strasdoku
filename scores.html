<script>
let allScores = [];
let currentTab = "global";

// ✅ Restore saved values (FIX)
const DEFAULT_ID = "69fc4ba6c0954111d8ebe1c4";
const DEFAULT_KEY = "$2a$10$o86oj1l5sYM6xmHiaLa7d.4so6kMmCt0ezoUGPTZUOi5/JESBwAFa"; // pas master !

const saved = { 
  id: localStorage.getItem("jb_id") || DEFAULT_ID,
  key: localStorage.getItem("jb_key") || DEFAULT_KEY,
  pseudo: localStorage.getItem("tramdoku_pseudo") || ""
};

document.getElementById("jbId").value = saved.id;
document.getElementById("jbKey").value = saved.key;
document.getElementById("myPseudo").value = saved.pseudo;

// ✅ Save on input
document.getElementById("jbId").addEventListener("input", e =>
  localStorage.setItem("jb_id", e.target.value)
);
document.getElementById("jbKey").addEventListener("input", e =>
  localStorage.setItem("jb_key", e.target.value)
);
document.getElementById("myPseudo").addEventListener("input", e =>
  localStorage.setItem("tramdoku_pseudo", e.target.value)
);

function switchTab(t) {
  currentTab = t;
  document.getElementById("tab-global").className = "tab" + (t === "global" ? " active" : "");
  document.getElementById("tab-perso").className = "tab" + (t === "perso" ? " active" : "");
  document.getElementById("panel-global").style.display = t === "global" ? "" : "none";
  document.getElementById("panel-perso").style.display = t === "perso" ? "" : "none";
}

async function charger() {
  const id = document.getElementById("jbId").value.trim();
  const key = document.getElementById("jbKey").value.trim();
  const st = document.getElementById("status");

  // ✅ FIX CONDITION
  if (!id || !key) {
    st.textContent = "⚠️ Remplis le Bin ID et la clé API.";
    st.className = "err";
    return;
  }

  st.textContent = "⏳ Chargement…";
  st.className = "";

  try {
    const res = await fetch("https://api.jsonbin.io/v3/b/" + id + "/latest", {
      headers: { "X-Master-Key": key }
    });

    if (!res.ok) throw new Error("HTTP " + res.status);

    const json = await res.json();
    allScores = (json.record && json.record.scores) ? json.record.scores : [];

    st.textContent = "✅ " + allScores.length + " score(s) chargé(s)";
    st.className = "ok";

    peuplerFiltreGrille();
    afficherGlobal();
    afficherPerso();

  } catch (e) {
    st.textContent = "❌ Erreur : " + e.message + " — vérifie ton Bin ID et ta clé.";
    st.className = "err";
  }
}

function peuplerFiltreGrille() {
  const sel = document.getElementById("filterGrille");

  const grilles = [...new Set(allScores.map(s => s.grille))].sort((a, b) => a - b);

  sel.innerHTML = '<option value="">Toutes les grilles</option>';

  grilles.forEach(g => {
    const titre = allScores.find(s => s.grille === g)?.titre || ("Grille #" + g);
    sel.innerHTML += `<option value="${g}">${titre}</option>`;
  });
}

function afficherGlobal() {
  const filtre = document.getElementById("filterGrille").value;
  const pseudo = document.getElementById("myPseudo").value.trim();

  let scores = filtre
    ? allScores.filter(s => String(s.grille) === String(filtre))
    : allScores;

  if (!scores.length) {
    document.getElementById("global-content").innerHTML =
      '<div class="empty-state"><div class="big">🏆</div>Aucun score pour l\'instant</div>';
    return;
  }

  scores = [...scores].sort((a, b) => b.score - a.score);

  const medals = ["🥇", "🥈", "🥉"];

  let h = '<table class="score-table"><thead><tr>';
  h += "<th>#</th><th>Joueur</th>";
  if (!filtre) h += "<th>Grille</th>";
  h += "<th>Score</th><th>Originalité</th><th>Date</th></tr></thead><tbody>";

  scores.forEach((s, i) => {
    const isMe = pseudo && s.pseudo === pseudo;

    h += `<tr class="rank-${i + 1}${isMe ? " highlight-row" : ""}">`;
    h += `<td>${medals[i] || (i + 1)}</td>`;
    h += `<td>${esc(s.pseudo)}${isMe ? " 👈" : ""}</td>`;
    if (!filtre) h += `<td>Grille #${s.grille}</td>`;
    h += `<td class="score-val">${s.score}</td>`;
    h += `<td class="orig-val">✨ ${s.orig || 0}</td>`;
    h += `<td>${s.date || "—"}</td>`;
    h += "</tr>";
  });

  h += "</tbody></table>";

  document.getElementById("global-content").innerHTML = h;
}

function afficherPerso() {
  const pseudo = document.getElementById("myPseudo").value.trim();

  if (!pseudo) {
    document.getElementById("perso-content").innerHTML =
      '<div class="empty-state"><div class="big">👤</div>Entre ton pseudo</div>';
    return;
  }

  const mes = allScores
    .filter(s => s.pseudo === pseudo)
    .sort((a, b) => a.grille - b.grille);

  if (!mes.length) {
    document.getElementById("perso-content").innerHTML =
      `<div class="empty-state"><div class="big">🎮</div>Aucun score pour « ${esc(pseudo)} »</div>`;
    return;
  }

  const totalScore = mes.reduce((s, e) => s + e.score, 0);
  const totalOrig = mes.reduce((s, e) => s + (e.orig || 0), 0);
  const best = Math.max(...mes.map(e => e.score));

  let h = '<div class="cards">';
  h += `<div class="stat-card"><div class="val">${mes.length}</div><div class="lbl">Grilles jouées</div></div>`;
  h += `<div class="stat-card"><div class="val">${totalScore}</div><div class="lbl">Score total</div></div>`;
  h += `<div class="stat-card"><div class="val">${best}</div><div class="lbl">Meilleur score</div></div>`;
  h += `<div class="stat-card"><div class="val" style="color:#5e35b1">${totalOrig}</div><div class="lbl">Originalité</div></div>`;
  h += '</div>';

  document.getElementById("perso-content").innerHTML = h;
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ✅ Auto-load OK
if (saved.id && saved.key) {
  charger();
}
</script>
